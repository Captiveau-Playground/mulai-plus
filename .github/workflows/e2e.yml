name: E2E Tests (PR)

on:
  pull_request:
    branches: [master, staging]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mulai_plus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Push DB
        working-directory: packages/db
        run: bun run db:push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/mulai_plus
          BETTER_AUTH_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          CORS_ORIGIN: http://localhost:3001
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET_NAME: test
          R2_PUBLIC_URL: http://test.com
      - name: Cache Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}
      - name: Install Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: node node_modules/.bin/playwright install chromium
      - name: Install system deps
        working-directory: apps/web
        run: node node_modules/.bin/playwright install-deps chromium
      - name: Create .env.local
        run: |
          cat > apps/web/.env.local << EOF
          NEXT_PUBLIC_SERVER_URL=http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=test
          EOF
      - name: Build Next.js
        run: bun run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      - name: Run E2E tests
        working-directory: apps/web
        run: node node_modules/.bin/playwright test --config=e2e/playwright.config.ts --workers=6
        env:
          CI: true
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
